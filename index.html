function update(dt){

cam.position.set(px,1.4+Math.sin(t*10)*.04*mv,pz);cam.rotation.set(pitch,yaw,0);
mmT-=dt;if(mmT<=0){mmT=.15;const cx=Math.floor(px/S),cz=Math.floor(pz/S);for(let z=cz-5;z<=cz+5;z++)for(let x=cx-5;x<=cx+5;x++)if(seen[z]&&seen[z][x]===0&&los(px,pz,x*S+S/2,z*S+S/2))seen[z][x]=1}
cd-=dt;kick=Math.max(0,kick-dt*5);if((mdown&&document.pointerLockElement)||tfire)fire();
for(const d of dr){const dist=Math.hypot(px-(d.x*S+S/2),pz-(d.z*S+S/2));
if(!d.op&&dist<S*1.4){if(d.L&&!P.key){msg('Potřebuješ červenou kartu!')}else{d.op=1;snd(200,.5,'triangle',.2,.4)}}
if(d.op&&d.o<1){d.o=Math.min(1,d.o+dt*1.2);d.m.position.y=H/2+d.o*H;if(d.o>.5)grid[d.z][d.x]='.'}}
for(const e of en){e.fl-=dt;const dx=px-e.x,dz=pz-e.z,d=Math.hypot(dx,dz);
if(e.dead){e.t+=dt;const k=Math.max(.2,1-e.t*2.5);e.s.scale.y=2.55*e.sc*k;e.s.position.y=e.s.scale.y/2;e.s.material.color.setHex(0x555555);continue}
const see=los(e.x,e.z,px,pz);if(!e.aw&&d<16&&see)e.aw=1;let moving=0;
if(e.aw){if(d>4||!see){const s=e.sp*dt,mx=dx/d*s,mz=dz/d*s;if(!hit(e.x+mx,e.z,.5*e.sc))e.x+=mx;if(!hit(e.x,e.z+mz,.5*e.sc))e.z+=mz;moving=1}
e.cd-=dt;if(see&&d<16&&e.cd<=0){e.cd=e.rate+Math.random()*.6;snd(e.b?140:220,.2,'square',.12,.5);for(let k=0;k<(e.b?3:1);k++)if(Math.random()<.7-d*.025)damage(e.dmg)}}
e.s.position.set(e.x,e.y+(moving?Math.abs(Math.sin(t*8+e.ph))*.1:0),e.z);e.s.material.color.setHex(e.fl>0?0xff5050:0xffffff)}
for(const p of pk){if(p.got)continue;p.s.position.y=.6+Math.sin(t*3)*.1;if(Math.hypot(px-p.x,pz-p.z)<1.2){
if(p.k=='H'){if(P.hp>=100)continue;P.hp=Math.min(100,P.hp+35);msg('+ Lékárnička')}else if(p.k=='A'){P.am+=24;P.sh+=5;msg('+ Munice')}else{P.key=1;msg('Získal jsi červenou kartu!')}
snd(700,.2,'triangle',.2,1.6);p.got=1;world.remove(p.s)}}
const ok=(!M.key||P.key)&&(!M.kill||en.every(e=>e.dead));ex.m.color.setHex(ok?0x30ff60:0xff2020);
if(Math.hypot(px-ex.x,pz-ex.z)<1.4){if(ok){snd(500,.6,'triangle',.25,3);if(lv<4)ovl('MISE SPLNĚNA!','Zabito nepřátel: '+kills+'\nVýtah vás veze dál...','DALŠÍ MISE',()=>startMission(lv+1),1);else ovl('VÍTĚZSTVÍ!','Král vetřelců je mrtvý a Země je zachráněna. Jste legenda!','HRÁT ZNOVU',()=>{P={hp:100,am:60,sh:8,key:0};startMission(0)},1)}else msg('Výtah je zablokovaný: '+obj())}}
function drawGun(){const w=gc.width,h=gc.height;g2.clearRect(0,0,w,h);if(state!='play')return;const c=g2,u=h/700,b=Math.sin(t*10)*(mv?10:0);
c.save();c.translate(w/2+b*1.5,h+Math.abs(b)+kick*40);c.scale(u,u);
if(!wpn){c.fillStyle=LG(c,'#e0a98a','#b57a5c',-120,40);c.fillRect(-50,-120,100,170);c.fillStyle=LG(c,'#9aa3ab','#3b4046',-320,-150);c.fillRect(-34,-320,68,190);c.fillStyle='#1b1e21';c.fillRect(-10,-332,20,30);c.fillRect(-34,-200,68,6);c.fillStyle='#d2d8de';c.fillRect(-30,-318,6,170)}
else{c.fillStyle=LG(c,'#8f979e','#2c3136',-420,-150);c.fillRect(-46,-420,40,300);c.fillRect(6,-420,40,300);c.fillStyle='#111';c.beginPath();c.arc(-26,-420,14,0,7);c.arc(26,-420,14,0,7);c.fill();c.fillStyle=LG(c,'#8a5a30','#4a2c14',-250,-160);c.fillRect(-60,-250,120,90);c.fillStyle=LG(c,'#e0a98a','#b57a5c',-130,60);c.fillRect(-70,-130,140,190)}
if(kick>.55){const fy=wpn?-440:-340,g=c.createRadialGradient(0,fy,5,0,fy,130);g.addColorStop(0,'#fff');g.addColorStop(.3,'#ffd34d');g.addColorStop(1,'#ff6a0000');c.fillStyle=g;c.fillRect(-150,fy-150,300,300)}
c.restore()}
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);t+=dt;$('tc').style.display=touch&&state=='play'?'block':'none';
if(state=='play'){update(dt);$('hp').textContent='❤ '+Math.ceil(P.hp)+(P.key?'  🔑':'');$('wp').textContent=W[wpn].n;$('am').textContent=wpn?'🔸 '+P.sh:'🔹 '+P.am;$('top').textContent='MISE '+(lv+1)+': '+M.n+' — '+obj();
msgT-=dt;if(msgT<=0)$('msg').textContent='';dmg=Math.max(0,dmg-dt);$('dm').style.opacity=dmg}
if(M)ren.render(scene,cam);drawGun();drawMap()}

const touch=navigator.maxTouchPoints>0||'ontouchstart' in window;let jx=0,jy=0,tfire=0,jid=null,lid=null,lx=0,ly=0;

const le=e=>{if(tt(e,lid))lid=null};lzE.addEventListener('touchend',le);lzE.addEventListener('touchcancel',le);

const N=mm.width,Wd=grid[0].length,c=mc,s=mbig?N*.7/Math.max(Wd,Hh):20,cx=mbig?Wd*s/2:px/S*s,cy=mbig?Hh*s/2:pz/S*s,k=Math.max(s,mbig?0:26);
